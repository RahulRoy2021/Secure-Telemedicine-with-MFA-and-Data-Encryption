<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .chat-link {
        text-decoration: none;
        color: #0d6efd;
      }

      .chat-link:hover {
        color: #084298;
        text-decoration: underline;
      }
    </style>
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">Telemedicine</a>
        <div class="d-flex">
          <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm"
            >Home</a
          >
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="card">
        <div class="card-header bg-white">
          <h4 class="mb-0">Your Chats</h4>
        </div>
        <ul class="list-group list-group-flush">
          {% for user in chat_users %}
          <li class="list-group-item">
            <a
              href="{% url 'chat:chat_room' receiver_username=user.username %}"
              class="chat-link"
            >
              {{ user.username }}
            </a>
          </li>
          {% empty %}
          <li class="list-group-item text-muted">No chats available.</li>
          {% endfor %}
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
