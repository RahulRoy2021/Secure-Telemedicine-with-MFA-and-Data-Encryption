<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Telemedicine Platform</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      /* Custom styles for centering and background */
      html,
      body {
        height: 100%; /* Ensure html and body take full height */
      }
      body {
        display: flex; /* Use flexbox to center content */
        align-items: center; /* Vertically center */
        justify-content: center; /* Horizontally center */
        background-color: #f8f9fa; /* Light gray background */
        padding-top: 40px; /* Add padding for potential navbar if needed */
        padding-bottom: 40px;
      }
      .login-form-container {
        max-width: 400px; /* Max width for the login card */
        width: 100%; /* Ensure it takes full width on smaller screens */
      }
    </style>
  </head>
  <body>
    <main class="login-form-container">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="card-title text-center mb-4 fw-bold">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </h2>

          {% if error %}
          <div
            class="alert alert-danger d-flex align-items-center"
            role="alert"
          >
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>{{ error }}</div>
          </div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label for="usernameInput" class="form-label"
                >Username or Email</label
              >
              <input
                type="text"
                class="form-control"
                id="usernameInput"
                name="username"
                {#
                Ensure
                name
                matches
                your
                Django
                view
                expectation
                #}
                required
                placeholder="Enter your username or email"
              />
            </div>

            <div class="mb-3">
              <label for="passwordInput" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="passwordInput"
                name="password"
                {#
                Ensure
                name
                matches
                your
                Django
                view
                expectation
                #}
                required
                placeholder="Enter your password"
              />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
              Login
            </button>

            <div class="text-center">
              <small class="text-muted">
                Don't have an account?
                <a href="{% url 'register' %}">Register here</a>
              </small>
              <br />
            </div>
          </form>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
